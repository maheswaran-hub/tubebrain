[project]
name = "tubebrain"
version = "0.1.0"
description = "TubeBrain — turn YouTube videos into AI skills. Download, extract captions and on-screen text, save as Claude Code skills."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Maheswaran"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "yt-dlp>=2024.1",
    "tqdm>=4.66",
]

[project.scripts]
tb = "tubebrain.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tubebrain*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
